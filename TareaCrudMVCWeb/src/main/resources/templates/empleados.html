<html lang="es" xmlns:th="http://www.thymeleaf.org">
   
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Clientes</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

    </head>
    <body class="bg-light">
        <div class="container mt-4">
            <div class="card shadow">
                <div class="card-header bg-dark text-white">

        <h2 class="mb-0"> Registro de Clientes </h2>

    </div>
        <h1>Registro de Clientes</h1>
        
        <div class="card-body"> 
            <div th:if="${mensaje}" class="alert alert-success alert-dismissible fade show"> 
                <span th:text="${mensaje}"></span> 
                <button type="button" class="btn-close" data-bs-dismiss="alert"> </button> 
            </div>
        <div th:if="${error}" class="alert alert-danger alert-dismissible fade show"> 
            <span th:text="${error}"> </span> 
            <button type="button" class="btn-close" data-bs-dismiss="alert"> </button> 
        </div>
            
         
         <form th:action="@{/clientes/guardar}" th:object="${cliente}" method="post"> 
             <input type="hidden" th:field="*{idCliente}"> 
             <div class="row"> <div class="col-md-6 mb-3"> 
                     <label class="form-label"> Nit </label> 
                     <input type="text" class="form-control" th:field="*{nit}" required> 
                 </div>   
            
        <div class="col-md-6 mb-3"> 
            <label class="form-label"> Nombre </label> 
            <input type="text" class="form-control" th:field="*{nombre}" required> 
        </div>
            <p th:if="${error}" th:text="${error}"></p>
        
            <div class="col-md-6 mb-3"> 
                <label class="form-label"> Apellidos </label> 
                <input type="text" class="form-control" th:field="*{apellidos}" required> 
            </div>
        <div class="col-md-6 mb-3"> 
            <label class="form-label"> Email </label> 
            <input type="email" class="form-control" th:field="*{email}" required> 
        </div> 
             </div>
             
             <button type="submit" class="btn btn-success"> Guardar </button> 
             <a href="/clientes" class="btn btn-secondary"> Limpiar </a> 
         </form>
         
        </div>
        </div>
            
       <div class="card shadow mt-4"> 
           <div class="card-header bg-dark text-white"> 
               <h3 class="mb-0"> Lista de Clientes </h3> </div>
           <div class="card-body"> 
               <div class="table-responsive"> 
                   <table class="table table-striped table-hover"> 
                       <thead class="table-dark"> </thead>
                       
        <tr> 
            <th>ID</th> 
            <th>NIT</th> 
            <th>Nombre</th> 
            <th>Apellidos</th> 
            <th>Email</th> 
            <th>Acciones</th> </tr>
        
        </thead> 
        <tbody> 
            <tr th:each="c : ${clientes}"> 
                <td th:text="${c.idCliente}"> </td> 
                <td th:text="${c.nit}"> </td> 
                <td th:text="${c.nombre}"> </td> 
                <td th:text="${c.apellidos}"> </td> 
                <td th:text="${c.email}"> </td> 
                <td>
                    
        <a th:href="@{/clientes/editar/{id}(id=${c.idCliente})}" class="btn btn-warning btn-sm"> Editar </a>
        <form th:action="@{/clientes/eliminar/{id}(id=${c.idCliente})}" method="post" class="d-inline">       
        </form>                
        </td>             
       </tr>
       
       <tr th:if="${#lists.isEmpty(clientes)}"> 
           <td colspan="6" class="text-center"> No hay clientes registrados. 
           </td>
       </tr>
       
       </tbody> 
       </table> 
    </div> 
    </div> 
    </div>            
    </div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"> </script>
    </body>
</html>
